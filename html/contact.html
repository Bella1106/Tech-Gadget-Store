<!DOCTYPE html>
<html>
    <head>
        <title>Contact us - Tech Gadget Store</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="../css/style.css">
    </head>

    <body>

        <!--HEADER-->
        <header class="heroBanner">
            <h1>
                Tech Gadget Store
            </h1>
            <p>
                Your one-stop shop for all the latest tech
            </p>
        </header>

        <!--NAVIGATION-->
        <!--respective buttons on navigation bar-->
        <nav>
            <a href="../index.html">Home</a>

            <a href="about.html" >About us</a>

            <a href="categories.html">Products</a>

            <a href="brands.html" >Featured Brands</a>

            <a href="contact.html">Get in contact</a>

            <a href="cart.html">Cart </a>
        </nav>

        <!--MAIN CONTENT-->
        <main class="contentSection">
            <h2 class="centerHeading">Contact Us</h2>

            <form class="formBox">
                <!--enter name-->
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your full name" required autofocus>

                <!--enter email-->
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email address" required>

                <!--enter subject of query-->
                <label for="subject">Subject</label>
                <input type="text" id="subject" name="subject" placeholder="Enter the subject" required>

                <!--enter message/query-->
                <label for="message">Message</label>
                <textarea id="message" name="message" placeholder="Type your message here..." required></textarea>

                <!--buttons-->
                <div class="buttonGroup">  
                    <button type="submit" class="primaryButton">Submit</button>             
                </div>
            </form>
        </main>

        <!--FOOTER-->
        <footer>
            <p>&copy; 2026 Tech Gadget Store</p>
            <p>Email: support@techgadgetstore.com</p>
            <p>Cape Town, South Africa</p>
        </footer>
    </body>
</html>
